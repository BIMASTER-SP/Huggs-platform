name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: backend (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rubyrose-backend
    env:
      JWT_SECRET: ci-secret-32-chars-or-more-deterministic-not-prod-use-only
      ALLOWED_ORIGINS: http://localhost:5173
      RATE_LIMIT_DEFAULT: 1000/minute
      RATE_LIMIT_LOGIN: 1000/minute
      RATE_LIMIT_REGISTER: 1000/minute
      RATE_LIMIT_CUPOM_LOOKUP: 1000/minute
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: rubyrose-backend/.venv
          key: poetry-${{ runner.os }}-${{ hashFiles('rubyrose-backend/poetry.lock') }}

      - name: Install deps
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Run tests
        run: poetry run pytest -ra

  frontend:
    name: frontend (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rubyrose-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: rubyrose-frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check + build
        run: npm run build

      - name: Run tests
        run: npm test
